<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>All Things New Share Test</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,300;0,400;0,600;0,700;0,800;1,800&family=Noto+Sans+SC:wght@400;600&display=swap" rel="stylesheet">
  <style>
    body { display:grid; min-height:100vh; margin:0; place-items:center; color:#12374a; background:#eef8f6; font:16px Montserrat,Arial,sans-serif; }
    main { width:min(480px,100%); padding:32px; text-align:center; }
    h1 { margin:0 0 12px; font-size:24px; }
    p { margin:0; color:#4c6875; line-height:1.6; }
    .language-actions { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin:24px 0; }
    button { min-height:46px; padding:10px 16px; color:#fff; background:#075d70; border:0; border-radius:10px; font:700 14px Montserrat,Arial,sans-serif; cursor:pointer; }
    button:hover { background:#063f58; }
    .language-actions button { color:#12374a; background:#fff; border:1px solid #c8dfdc; }
    .language-actions button.is-selected { color:#fff; background:#075d70; border-color:#075d70; }
    #result { margin-top:24px; text-align:left; }
    label { display:block; margin-bottom:8px; font-size:14px; font-weight:700; }
    textarea { width:100%; min-height:130px; padding:12px; color:#12374a; background:#fff; border:1px solid #c8dfdc; border-radius:10px; font:14px/1.5 Montserrat,Arial,sans-serif; resize:vertical; }
    #copy-caption { width:100%; margin-top:12px; }
    #image-preview { display:block; width:100%; max-height:380px; margin:20px auto 0; border:1px solid #c8dfdc; border-radius:12px; object-fit:contain; }
    #image-preview[hidden] { display:none; }
    @media (max-width:520px) { main { padding:24px 18px; }.language-actions { gap:7px; }.language-actions button { padding-inline:8px; font-size:13px; }#image-preview { max-height:320px; } }
  </style>
</head>
<body>
  <main>
    <h1 id="test-title">Share test post</h1>
    <p id="status" aria-live="polite">Choose a language to create and download the test image.</p>
    <div class="language-actions" aria-label="Choose language">
      <button type="button" data-language="english">English</button>
      <button type="button" data-language="chinese">中文</button>
      <button type="button" data-language="malay">Malay</button>
    </div>
    <img id="image-preview" alt="Generated test post image" hidden>
    <div id="result" hidden>
      <label id="caption-label" for="caption">Caption and hashtag</label>
      <textarea id="caption" readonly></textarea>
      <button id="copy-caption" type="button">Download image and copy caption</button>
    </div>
  </main>
  <script src="share-test.js?v=8"></script>
</body>
</html>
